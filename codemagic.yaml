workflows:
  android-apk:
    name: HustleKit APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # For the Play Store build, uncomment these 2 lines after uploading your keystore:
      # android_signing:
      #   - hustlekit_keystore
    scripts:
      - name: Generate Android project
        script: |
          rm -rf android
          flutter create . --project-name hustlekit --org zw.hustlekit --platforms android
      - name: Patch manifest and signing
        script: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          top = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                 '<queries>\n'
                 '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
                 '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>\n'
                 '</queries>\n')
          meta = ('<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" '
                  'android:value="ca-app-pub-3940256099942544~3347511713"/>\n')
          s = s.replace('<application', top + '<application', 1)
          s = s.replace('</application>', meta + '</application>', 1)
          s = s.replace('android:label="hustlekit"', 'android:label="HustleKit" android:allowBackup="false"')
          open(p, 'w').write(s)
          g = 'android/app/build.gradle.kts'
          t = open(g).read()
          sign = ('    signingConfigs {\n        create("release") {\n'
                  '            val ks = System.getenv("CM_KEYSTORE_PATH")\n'
                  '            if (ks != null) {\n'
                  '                storeFile = file(ks)\n'
                  '                storePassword = System.getenv("CM_KEYSTORE_PASSWORD")\n'
                  '                keyAlias = System.getenv("CM_KEY_ALIAS")\n'
                  '                keyPassword = System.getenv("CM_KEY_PASSWORD")\n'
                  '            }\n        }\n    }\n')
          t = t.replace('    buildTypes {', sign + '    buildTypes {', 1)
          t = t.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName(if (System.getenv("CM_KEYSTORE_PATH") != null) "release" else "debug")')
          open(g, 'w').write(t)
          EOF
      - name: Verify manifest
        script: |
          cat android/app/src/main/AndroidManifest.xml
          grep -q "ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: flutter pub get
      - name: Generate app icon
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
      - name: Build Play Store bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
