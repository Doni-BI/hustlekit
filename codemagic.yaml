workflows:
  android-apk:
    name: HustleKit APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: flutter create . --project-name hustlekit --org zw.hustlekit --platforms android
      - name: Patch manifest
        script: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          top = ('<uses-permission android:name="android.permission.INTERNET"/>\n'
                 '<queries>\n'
                 '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
                 '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>\n'
                 '</queries>\n')
          meta = ('<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" '
                  'android:value="ca-app-pub-3940256099942544~3347511713"/>\n')
          s = s.replace('<application', top + '<application', 1)
          s = s.replace('</application>', meta + '</application>', 1)
          open(p, 'w').write(s)
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
