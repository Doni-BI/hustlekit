name: HustleKit
description: HustleKit - Zimbabwe Hustler Toolkit (offline first)
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  screenshot: ^3.0.0
  google_mobile_ads: ^9.1.0
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  intl: ^0.19.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0A4D3C"
  adaptive_icon_foreground: "assets/icon.png"
